<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map bench (J0)</title>
<style>
  html, body { margin: 0; height: 100%; background: #22314f; overflow: hidden; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #fbfbf7; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; left: 8px; top: 8px; max-width: calc(100% - 16px); background: rgba(22, 19, 22, 0.82); border-radius: 6px; padding: 8px; }
  #panel.min #out, #panel.min #log { display: none; }
  #panel button { font: inherit; padding: 6px 10px; margin-right: 4px; background: #3f6849; color: #fbfbf7; border: 0; border-radius: 4px; }
  #out, #log { white-space: pre; overflow: auto; max-height: 40vh; margin: 6px 0 0; }
  #log { color: #bfcbd4; max-height: 15vh; }
  #hud { color: #e2c487; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="panel">
  <button id="run">Run all</button><button id="copy">Copy</button><button id="hidebtn">–</button>
  <div id="hud"></div>
  <pre id="out"></pre>
  <pre id="log"></pre>
</div>
